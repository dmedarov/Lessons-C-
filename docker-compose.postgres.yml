services:
  postgres:
    image: cgr.dev/chainguard/postgres:latest
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-fleetflow}"
      POSTGRES_USER: "${POSTGRES_USER:-fleetflow}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-fleetflow-dev-password}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  car-pool:
    build: .
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_ENV: "${APP_ENV:-prod}"
      SECRET_KEY: "${SECRET_KEY:?set SECRET_KEY in .env}"
      TOKEN_TTL_SECONDS: "${TOKEN_TTL_SECONDS:-3600}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://fleetflow:fleetflow-dev-password@postgres:5432/fleetflow}"
      RUN_MIGRATIONS: "true"
    restart: unless-stopped

volumes:
  postgres_data:
