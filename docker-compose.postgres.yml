services:
  postgres:
    image: cgr.dev/chainguard/postgres:latest
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-fleetflow}"
      POSTGRES_USER: "${POSTGRES_USER:-fleetflow}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-fleetflow-dev-password}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  car-pool:
    build: .
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: "${APP_ENV:-prod}"
      SECRET_KEY: "${SECRET_KEY:?set SECRET_KEY in .env}"
      TOKEN_TTL_SECONDS: "${TOKEN_TTL_SECONDS:-3600}"
      REFRESH_TOKEN_TTL_SECONDS: "${REFRESH_TOKEN_TTL_SECONDS:-1209600}"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-}"
      DEV_SEED_DEMO_DATA: "${DEV_SEED_DEMO_DATA:-false}"
      LOGIN_RATE_LIMIT_ATTEMPTS: "${LOGIN_RATE_LIMIT_ATTEMPTS:-5}"
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: "${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}"
      BOOTSTRAP_RATE_LIMIT_ATTEMPTS: "${BOOTSTRAP_RATE_LIMIT_ATTEMPTS:-3}"
      BOOTSTRAP_RATE_LIMIT_WINDOW_SECONDS: "${BOOTSTRAP_RATE_LIMIT_WINDOW_SECONDS:-3600}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://fleetflow:fleetflow-dev-password@postgres:5432/fleetflow}"
      NETFLEET_API_KEY: "${NETFLEET_API_KEY:-}"
      NETFLEET_BASE_URL: "${NETFLEET_BASE_URL:-https://api.netfleet.bg:8080}"
      NETFLEET_TIMEOUT_SECONDS: "${NETFLEET_TIMEOUT_SECONDS:-5}"
      NOTIFICATION_TIMEOUT_SECONDS: "${NOTIFICATION_TIMEOUT_SECONDS:-5}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-}"
      SMTP_TO_EMAIL: "${SMTP_TO_EMAIL:-}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-true}"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
      TEAMS_WEBHOOK_URL: "${TEAMS_WEBHOOK_URL:-}"
      RUN_MIGRATIONS: "true"
    restart: unless-stopped

volumes:
  postgres_data:
