<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Pool Reservations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h1 class="mb-3">Служебни автомобили – резервации</h1>

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-md-3">
              <label class="form-label">Username</label>
              <input class="form-control" id="username" placeholder="admin / ivan" />
            </div>
            <div class="col-md-3">
              <label class="form-label">Password</label>
              <input class="form-control" id="password" type="password" placeholder="admin123 / employee123" />
            </div>
            <div class="col-md-2">
              <button class="btn btn-primary w-100" id="loginBtn">Login</button>
            </div>
            <div class="col-md-4">
              <div id="sessionBadge" class="badge bg-secondary">Not logged in</div>
            </div>
          </div>
          <div class="small text-muted mt-2">Demo users: admin/admin123, ivan/employee123</div>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Добави автомобил (admin)</h5>
              <form id="carForm">
                <input class="form-control mb-2" id="plate" placeholder="Рег. номер" required />
                <input class="form-control mb-2" id="model" placeholder="Модел" required />
                <button class="btn btn-primary w-100" type="submit">Запази</button>
              </form>
            </div>
          </div>

          <div class="card shadow-sm mt-4">
            <div class="card-body">
              <h5 class="card-title">Нова резервация</h5>
              <form id="reservationForm">
                <select class="form-select mb-2" id="carId" required></select>
                <input class="form-control mb-2" id="startTime" type="datetime-local" required />
                <input class="form-control mb-2" id="endTime" type="datetime-local" required />
                <input class="form-control mb-2" id="purpose" placeholder="Цел" />
                <button class="btn btn-success w-100" type="submit">Създай (pending)</button>
                <div class="form-text">Резервацията се записва на името на логнатия потребител.</div>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="card shadow-sm mb-4">
            <div class="card-body">
              <h5 class="card-title">Автомобили</h5>
              <table class="table table-striped" id="carsTable">
                <thead><tr><th>ID</th><th>Номер</th><th>Модел</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>

          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Резервации (workflow)</h5>
              <table class="table table-striped" id="reservationsTable">
                <thead>
                  <tr>
                    <th>ID</th><th>Car</th><th>Служител</th><th>Статус</th><th>От</th><th>До</th><th>Действия</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <div id="message" class="alert d-none mt-4" role="alert"></div>
    </div>

    <script>
      const messageBox = document.getElementById("message");
      const sessionBadge = document.getElementById("sessionBadge");
      let accessToken = null;
      let currentRole = null;
      let currentUser = null;

      function showMessage(text, type = "success") {
        messageBox.className = `alert alert-${type} mt-4`;
        messageBox.textContent = text;
        messageBox.classList.remove("d-none");
      }

      function authHeaders() {
        if (accessToken) {
          return { "Content-Type": "application/json", Authorization: `Bearer ${accessToken}` };
        }
        return { "Content-Type": "application/json" };
      }

      function statusBadge(status) {
        const map = {
          pending: "warning text-dark",
          approved: "success",
          rejected: "danger",
          cancelled: "secondary",
        };
        const cls = map[status] || "secondary";
        return `<span class="badge bg-${cls}">${status}</span>`;
      }

      function toIso(v) {
        return v ? new Date(v).toISOString() : null;
      }

      async function login() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });

        if (!res.ok) {
          showMessage("Login failed. Провери user/password.", "danger");
          return;
        }

        const data = await res.json();
        accessToken = data.access_token;
        currentRole = data.role;
        currentUser = data.user;
        sessionBadge.className = `badge ${currentRole === "fleet_admin" ? "bg-danger" : "bg-primary"}`;
        sessionBadge.textContent = `Logged as ${currentUser} (${currentRole})`;
        showMessage("Успешен login.");
        await fetchReservations();
      }

      async function fetchCars() {
        const res = await fetch("/cars");
        const data = await res.json();
        const body = document.querySelector("#carsTable tbody");
        const select = document.getElementById("carId");
        body.innerHTML = "";
        select.innerHTML = "";

        for (const car of data.items) {
          body.insertAdjacentHTML("beforeend", `<tr><td>${car.id}</td><td>${car.plate_number}</td><td>${car.model}</td></tr>`);
          select.insertAdjacentHTML("beforeend", `<option value="${car.id}">${car.plate_number} - ${car.model}</option>`);
        }
      }

      async function approveReject(id, actionType) {
        const res = await fetch(`/reservations/${id}/${actionType}`, {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({ reason: `${actionType} via UI` }),
        });
        if (!res.ok) {
          const err = await res.json();
          showMessage(err.detail || `${actionType} error`, "danger");
          return;
        }
        showMessage(`Reservation #${id} ${actionType}d.`);
        await fetchReservations();
      }

      async function cancelReservation(id) {
        const res = await fetch(`/reservations/${id}/cancel`, {
          method: "POST",
          headers: authHeaders(),
        });
        if (!res.ok) {
          const err = await res.json();
          showMessage(err.detail || "cancel error", "danger");
          return;
        }
        showMessage(`Reservation #${id} cancelled.`);
        await fetchReservations();
      }

      async function fetchReservations() {
        const body = document.querySelector("#reservationsTable tbody");
        body.innerHTML = "";
        if (!accessToken) return;
        const res = await fetch("/reservations", { headers: authHeaders() });
        if (!res.ok) return;
        const data = await res.json();

        for (const item of data.items) {
          const actions = [];
          if (item.status === "pending") {
            actions.push(`<button class='btn btn-sm btn-outline-success me-1' onclick='approveReject(${item.id},"approve")'>Approve</button>`);
            actions.push(`<button class='btn btn-sm btn-outline-danger me-1' onclick='approveReject(${item.id},"reject")'>Reject</button>`);
          }
          if (["pending", "approved"].includes(item.status)) {
            actions.push(`<button class='btn btn-sm btn-outline-secondary' onclick='cancelReservation(${item.id})'>Cancel</button>`);
          }

          body.insertAdjacentHTML(
            "beforeend",
            `<tr>
              <td>${item.id}</td>
              <td>${item.car_id}</td>
              <td>${item.employee_name}</td>
              <td>${statusBadge(item.status)}</td>
              <td>${item.start_time}</td>
              <td>${item.end_time}</td>
              <td>${actions.join("")}</td>
            </tr>`
          );
        }
      }

      document.getElementById("loginBtn").addEventListener("click", login);

      document.getElementById("carForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = { plate_number: document.getElementById("plate").value, model: document.getElementById("model").value };
        const res = await fetch("/cars", { method: "POST", headers: authHeaders(), body: JSON.stringify(payload) });
        if (!res.ok) {
          const err = await res.json();
          showMessage(err.detail || "Car create error", "danger");
          return;
        }
        showMessage("Автомобилът е добавен.");
        e.target.reset();
        await fetchCars();
      });

      document.getElementById("reservationForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
          car_id: Number(document.getElementById("carId").value),
          start_time: toIso(document.getElementById("startTime").value),
          end_time: toIso(document.getElementById("endTime").value),
          purpose: document.getElementById("purpose").value || null,
        };
        const res = await fetch("/reservations", { method: "POST", headers: authHeaders(), body: JSON.stringify(payload) });
        if (!res.ok) {
          const err = await res.json();
          showMessage(err.detail || "Reservation error", "danger");
          return;
        }
        showMessage("Резервацията е създадена (pending).");
        e.target.reset();
        await fetchReservations();
      });

      window.approveReject = approveReject;
      window.cancelReservation = cancelReservation;

      (async function init() {
        await fetchCars();
        await fetchReservations();
      })();
    </script>
  </body>
</html>
