<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Pool Reservations</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h1 class="mb-4">Служебни автомобили – резервации</h1>

      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Добави автомобил</h5>
              <form id="carForm">
                <div class="mb-3">
                  <label class="form-label">Рег. номер</label>
                  <input class="form-control" id="plate" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">Модел</label>
                  <input class="form-control" id="model" required />
                </div>
                <button class="btn btn-primary w-100" type="submit">Запази</button>
              </form>
            </div>
          </div>

          <div class="card shadow-sm mt-4">
            <div class="card-body">
              <h5 class="card-title">Нова резервация</h5>
              <form id="reservationForm">
                <div class="mb-3">
                  <label class="form-label">Автомобил</label>
                  <select class="form-select" id="carId" required></select>
                </div>
                <div class="mb-3">
                  <label class="form-label">Служител</label>
                  <input class="form-control" id="employeeName" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">От</label>
                  <input class="form-control" id="startTime" type="datetime-local" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">До</label>
                  <input class="form-control" id="endTime" type="datetime-local" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">Цел</label>
                  <input class="form-control" id="purpose" />
                </div>
                <button class="btn btn-success w-100" type="submit">Резервирай</button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="card shadow-sm mb-4">
            <div class="card-body">
              <h5 class="card-title">Автомобили</h5>
              <div class="table-responsive">
                <table class="table table-striped" id="carsTable">
                  <thead><tr><th>ID</th><th>Номер</th><th>Модел</th></tr></thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Резервации</h5>
              <div class="table-responsive">
                <table class="table table-striped" id="reservationsTable">
                  <thead>
                    <tr><th>ID</th><th>Car ID</th><th>Служител</th><th>От</th><th>До</th><th>Цел</th></tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="message" class="alert d-none mt-4" role="alert"></div>
    </div>

    <script>
      const carForm = document.getElementById("carForm");
      const reservationForm = document.getElementById("reservationForm");
      const messageBox = document.getElementById("message");

      function normalizeDateTime(value) {
        return value ? new Date(value).toISOString() : null;
      }

      function showMessage(text, type = "success") {
        messageBox.className = `alert alert-${type} mt-4`;
        messageBox.textContent = text;
        messageBox.classList.remove("d-none");
      }

      async function fetchCars() {
        const res = await fetch("/cars");
        const data = await res.json();

        const body = document.querySelector("#carsTable tbody");
        const select = document.getElementById("carId");
        body.innerHTML = "";
        select.innerHTML = "";

        for (const car of data.items) {
          body.insertAdjacentHTML(
            "beforeend",
            `<tr><td>${car.id}</td><td>${car.plate_number}</td><td>${car.model}</td></tr>`
          );
          select.insertAdjacentHTML(
            "beforeend",
            `<option value="${car.id}">${car.plate_number} - ${car.model}</option>`
          );
        }
      }

      async function fetchReservations() {
        const res = await fetch("/reservations");
        const data = await res.json();
        const body = document.querySelector("#reservationsTable tbody");
        body.innerHTML = "";

        for (const item of data.items) {
          body.insertAdjacentHTML(
            "beforeend",
            `<tr>
              <td>${item.id}</td>
              <td>${item.car_id}</td>
              <td>${item.employee_name}</td>
              <td>${item.start_time}</td>
              <td>${item.end_time}</td>
              <td>${item.purpose ?? ""}</td>
            </tr>`
          );
        }
      }

      carForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
          plate_number: document.getElementById("plate").value,
          model: document.getElementById("model").value,
        };

        const res = await fetch("/cars", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          const err = await res.json();
          showMessage(err.detail ?? "Грешка при добавяне на автомобил", "danger");
          return;
        }

        showMessage("Автомобилът е добавен успешно.");
        carForm.reset();
        await fetchCars();
      });

      reservationForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
          car_id: Number(document.getElementById("carId").value),
          employee_name: document.getElementById("employeeName").value,
          start_time: normalizeDateTime(document.getElementById("startTime").value),
          end_time: normalizeDateTime(document.getElementById("endTime").value),
          purpose: document.getElementById("purpose").value || null,
        };

        const res = await fetch("/reservations", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          const err = await res.json();
          showMessage(err.detail ?? "Грешка при създаване на резервация", "danger");
          return;
        }

        showMessage("Резервацията е създадена успешно.");
        reservationForm.reset();
        await fetchReservations();
      });

      async function init() {
        await fetchCars();
        await fetchReservations();
      }

      init();
    </script>
  </body>
</html>
