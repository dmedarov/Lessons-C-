name: Production Gates

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Scan tracked files for secrets
        run: python scripts/scan_secrets.py

      - name: Compile Python modules
        run: python -m py_compile app.py db.py schemas.py security.py production_readiness.py routers/*.py fleet_intelligence/*.py

      - name: Run tests
        run: python -m pytest -q

      - name: Check browser JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/i18n.js

      - name: Audit production dependencies
        run: pip-audit -r requirements.txt

      - name: Build production image
        if: matrix.python-version == '3.14'
        run: docker build -t fleetflow-production-gates .
