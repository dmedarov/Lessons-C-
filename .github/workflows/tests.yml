name: quality-gates

on:
  push:
    branches: [master, work]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python modules
        run: |
          python -m py_compile \
            app.py \
            bootstrap_tokens.py \
            config.py \
            container_entrypoint.py \
            db.py \
            notifications_service.py \
            rate_limit.py \
            security.py \
            schemas.py \
            routers/auth.py \
            routers/cars.py \
            routers/notifications.py \
            routers/reservations.py \
            routers/users.py

      - name: Run tests
        run: pytest -q

      - name: Check JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/i18n.js
          node --check static/theme.js

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Build production Docker image
        if: matrix.python-version == '3.14'
        run: docker build --pull -t fleetflow-ci .

  docker-publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    needs: checks
    # Only publish when tests pass on every master push — not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            dmedarov/fleetflow:latest
            dmedarov/fleetflow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
