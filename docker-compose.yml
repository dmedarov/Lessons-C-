services:
  car-pool:
    build: .
    container_name: car-pool-app
    init: true
    ports:
      - "8000:8000"
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      SECRET_KEY: "${SECRET_KEY:-dev-insecure-change-me}"
      TOKEN_TTL_SECONDS: "${TOKEN_TTL_SECONDS:-3600}"
      DEV_SEED_DEMO_DATA: "${DEV_SEED_DEMO_DATA:-true}"
      DB_PATH: "/data/fleet.db"
    volumes:
      - car_pool_data:/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  car_pool_data:
