services:
  car-pool:
    build: .
    container_name: car-pool-api
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: "${SECRET_KEY:-dev-insecure-change-me}"
      APP_ENV: "${APP_ENV:-dev}"
      TOKEN_TTL_SECONDS: "${TOKEN_TTL_SECONDS:-3600}"
      DB_PATH: "/data/fleet.db"
    volumes:
      - car_pool_data:/data
    restart: unless-stopped

volumes:
  car_pool_data:
