services:
  car-pool:
    build: .
    init: true
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      SECRET_KEY: "${SECRET_KEY:-dev-insecure-change-me}"
      TOKEN_TTL_SECONDS: "${TOKEN_TTL_SECONDS:-3600}"
      DEV_SEED_DEMO_DATA: "${DEV_SEED_DEMO_DATA:-true}"
      NETFLEET_API_KEY: "${NETFLEET_API_KEY:-}"
      NETFLEET_BASE_URL: "${NETFLEET_BASE_URL:-https://api.netfleet.bg:8080}"
      NETFLEET_TIMEOUT_SECONDS: "${NETFLEET_TIMEOUT_SECONDS:-5}"
      DB_PATH: "/data/fleet.db"
    volumes:
      - car_pool_data:/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  car_pool_data:
